<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style et Matière - Paramètres</title>

  <style>
    :root {
      --primary: #00796b;
      --primary-dark: #004d40;
      --secondary: #f2eb2d;
      --gray-light: #f5f7fa;
      --gray-border: #e0e6ed;
      --success: #4CAF50;
      --warning: #ff9800;
      --danger: #f44336;

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--gray-light);
      min-height: 100vh;

    .page-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;

    .page-header {
      margin-bottom: 30px;

    .page-title {
      font-size: 28px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;

    .page-subtitle {
      font-size: 16px;
      color: #666;

    /* Settings Sections */
    .settings-section {
      background: white;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 20px;

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 20px;
      color: #333;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--gray-border);

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;

    .form-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gray-border);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 121, 107, 0.1);

    .form-textarea {
      min-height: 120px;
      resize: vertical;

    .form-help {
      font-size: 13px;
      color: #666;
      margin-top: 5px;

    /* Buttons */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;

    .btn-primary {
      background: var(--primary);
      color: white;

    .btn-primary:hover {
      background: var(--primary-dark);

    .btn-secondary {
      background: white;
      color: #666;
      border: 1px solid var(--gray-border);

    .btn-secondary:hover {
      background: var(--gray-light);

    .btn-danger {
      background: var(--danger);
      color: white;

    .btn-danger:hover {
      background: #d32f2f;

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;

    /* Info Box */
    .info-box {
      background: #e3f2fd;
      border: 1px solid #2196F3;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;

    .info-box.warning {
      background: #fff8e1;
      border-color: var(--warning);

    .info-box.danger {
      background: #ffebee;
      border-color: var(--danger);

    .info-icon {
      font-size: 20px;
      flex-shrink: 0;

    .info-text {
      font-size: 14px;
      color: #333;
      line-height: 1.5;

    /* User Info */
    .user-info-card {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: var(--gray-light);
      border-radius: 8px;
      margin-bottom: 20px;

    .user-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;

    .user-details {
      flex: 1;

    .user-name {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 5px;

    .user-email {
      font-size: 14px;
      color: #666;

    .user-role {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      text-transform: uppercase;
      margin-top: 5px;

    /* Admin Only Section */
    .admin-only {
      border: 2px dashed var(--warning);
      background: #fffef7;

    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;

    .spinner {
      border: 3px solid var(--gray-border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }

    /* Responsive Design */
    @media (max-width: 768px) {
      .page-container {
        padding: 10px;

      .button-group {
        flex-direction: column;

      .btn {
        width: 100%;
  </style>
</head>
<body>
  <!-- Inject user data and web app URL for header -->
  <script>
    window.USER_DATA = <?!= JSON.stringify(user || {}) ?>;
    window.WEB_APP_URL = <?!= JSON.stringify(webAppUrl || '') ?>;
  </script>

  <!-- Include Header Component -->
  <?!= include('pages/components/header'); ?>

  <!-- Include Utilities -->
  <?!= include('pages/components/utilities'); ?>

  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">⚙️ Paramètres</h1>
      <p class="page-subtitle">Gérez vos préférences et configurations</p>
    </div>

    <div id="settings-content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Chargement des paramètres...</p>
      </div>
    </div>
  </div>

  <!-- Include API Helper -->
  <?!= include('pages/components/api-helper'); ?>

  <script>
    // Global state
    let currentUser = <?= JSON.stringify(user) ?>;
    let emailTemplates = null;
    let isDirty = false;

    /**
     * Initialize settings page
     */
    window.addEventListener('DOMContentLoaded', function() {
      loadSettings();
      setupBeforeUnload();
      highlightActiveNavLink();
    });

    /**
     * Setup warning before leaving if there are unsaved changes
     */
    function setupBeforeUnload() {
      window.addEventListener('beforeunload', function(e) {
        if (isDirty) {
          e.preventDefault();
          e.returnValue = '';
      });

    /**
     * Load settings data
     */
    async function loadSettings() {
      try {
        const data = await API.getEmailTemplates();
        emailTemplates = data;
        renderSettings();
      } catch (error) {
        console.error('Error loading settings:', error);
        showError('Erreur lors du chargement des paramètres: ' + error.message);

    /**
     * Render settings page
     */
    function renderSettings() {
      const container = document.getElementById('settings-content');

      container.innerHTML = `
        <!-- User Profile Section -->
        <div class="settings-section">
          <div class="section-header">
            👤 Profil utilisateur
          </div>

          <div class="user-info-card">
            <div class="user-avatar">
              ${getUserInitials(currentUser.name)}
            </div>
            <div class="user-details">
              <div class="user-name">${escapeHtml(currentUser.name)}</div>
              <div class="user-email">${escapeHtml(currentUser.email)}</div>
              ${currentUser.role === 'admin' ? '<span class="user-role">Administrateur</span>' : '<span class="user-role">Utilisateur</span>'}
            </div>
          </div>

          <div class="info-box">
            <span class="info-icon">ℹ️</span>
            <div class="info-text">
              Votre profil est géré par votre compte Google. Pour modifier vos informations personnelles,
              visitez votre <a href="https://myaccount.google.com" target="_blank" style="color: var(--primary);">compte Google</a>.
            </div>
          </div>
        </div>

        <!-- Email Templates Section -->
        <div class="settings-section">
          <div class="section-header">
            ✉️ Modèles d'email
          </div>

          ${renderEmailTemplates()}
        </div>

        <!-- Admin Only Sections -->
        ${currentUser.role === 'admin' ? renderAdminSettings() : ''}

        <!-- About Section -->
        <div class="settings-section">
          <div class="section-header">
            ℹ️ À propos
          </div>

          <div class="form-group">
            <strong>Style et Matière CRM</strong>
            <p style="margin-top: 5px; color: #666; font-size: 14px;">
              Version 3.5 - Système de gestion client pour artisans
            </p>
          </div>

          <div class="form-group">
            <div class="info-text" style="font-size: 14px; line-height: 1.6;">
              Ce système vous permet de gérer vos clients, devis, factures et projets
              depuis une interface intuitive tout en gardant vos données dans Google Sheets.
            </div>
          </div>
        </div>
      `;

      // Attach event listeners for marking form as dirty
      attachFormListeners();

    /**
     * Render email templates editor
     */
    function renderEmailTemplates() {
      return `
        <div class="info-box">
          <span class="info-icon">💡</span>
          <div class="info-text">
            Personnalisez les modèles d'email utilisés pour contacter vos clients.
            Utilisez les variables comme {{CLIENT_NAME}}, {{QUOTE_NUMBER}}, etc.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Modèle: Envoi de devis</label>
          <textarea
            class="form-textarea"
            id="template-quote"
            oninput="markDirty()"
          >${escapeHtml(emailTemplates?.quote || '')}</textarea>
          <div class="form-help">
            Variables disponibles: {{CLIENT_NAME}}, {{QUOTE_NUMBER}}, {{QUOTE_LINK}}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Modèle: Email de suivi</label>
          <textarea
            class="form-textarea"
            id="template-followup"
            oninput="markDirty()"
          >${escapeHtml(emailTemplates?.followup || '')}</textarea>
          <div class="form-help">
            Variables disponibles: {{CLIENT_NAME}}, {{DAYS_SINCE_QUOTE}}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Modèle: Demande de témoignage</label>
          <textarea
            class="form-textarea"
            id="template-testimonial"
            oninput="markDirty()"
          >${escapeHtml(emailTemplates?.testimonial || '')}</textarea>
          <div class="form-help">
            Variables disponibles: {{CLIENT_NAME}}, {{PROJECT_NAME}}
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" onclick="saveEmailTemplates()">
            💾 Sauvegarder les modèles
          </button>
          <button class="btn btn-secondary" onclick="resetToDefaults()">
            🔄 Réinitialiser par défaut
          </button>
        </div>
      `;

    /**
     * Render admin-only settings
     */
    function renderAdminSettings() {
      return `
        <div class="settings-section admin-only">
          <div class="section-header">
            🔐 Paramètres administrateur
          </div>

          <div class="info-box warning">
            <span class="info-icon">⚠️</span>
            <div class="info-text">
              <strong>Section réservée aux administrateurs</strong><br>
              Ces paramètres affectent tous les utilisateurs du système. Procédez avec précaution.
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Compteur de factures</label>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input
                type="number"
                class="form-input"
                id="invoice-counter"
                value="${emailTemplates?.invoiceCounter || 1}"
                readonly
                style="max-width: 150px;"
              >
              <button class="btn btn-secondary" onclick="viewInvoiceCounter()">
                👁️ Voir
              </button>
            </div>
            <div class="form-help">
              Numéro de la prochaine facture. Géré automatiquement par le système.
            </div>
          </div>

          <div class="info-box danger">
            <span class="info-icon">🚨</span>
            <div class="info-text">
              <strong>Zone dangereuse</strong><br>
              Les actions ci-dessous sont irréversibles. Assurez-vous de comprendre leurs conséquences.
            </div>
          </div>

          <div class="button-group">
            <button class="btn btn-danger" onclick="confirmResetInvoiceCounter()">
              🔄 Réinitialiser le compteur de factures
            </button>
          </div>
        </div>
      `;

    /**
     * Mark form as dirty (unsaved changes)
     */
    function markDirty() {
      isDirty = true;

    /**
     * Attach form listeners
     */
    function attachFormListeners() {
      const inputs = document.querySelectorAll('input, textarea, select');
      inputs.forEach(input => {
        input.addEventListener('input', markDirty);
      });

    /**
     * Save email templates
     */
    async function saveEmailTemplates() {
      try {
        const templates = {
          quote: document.getElementById('template-quote').value,
          followup: document.getElementById('template-followup').value,
          testimonial: document.getElementById('template-testimonial').value
        };

        await API.saveEmailTemplates(templates);

        isDirty = false;
        showToast('Modèles d\'email sauvegardés avec succès', 'success');
      } catch (error) {
        console.error('Error saving templates:', error);
        alert('Erreur lors de la sauvegarde: ' + error.message);

    /**
     * Reset email templates to defaults
     */
    async function resetToDefaults() {
      if (!confirm('Êtes-vous sûr de vouloir réinitialiser tous les modèles d\'email?\nCette action est irréversible.')) {
        return;

      try {
        await API.resetEmailTemplates();
        await loadSettings();

        isDirty = false;
        showToast('Modèles réinitialisés aux valeurs par défaut', 'success');
      } catch (error) {
        console.error('Error resetting templates:', error);
        alert('Erreur lors de la réinitialisation: ' + error.message);

    /**
     * View invoice counter details
     */
    async function viewInvoiceCounter() {
      try {
        const counter = await API.getInvoiceCounter();
        alert(`Compteur de factures actuel: ${counter}\n\nLa prochaine facture générée aura le numéro: ${counter}`);
      } catch (error) {
        console.error('Error getting counter:', error);
        alert('Erreur lors de la récupération du compteur: ' + error.message);

    /**
     * Confirm and reset invoice counter
     */
    async function confirmResetInvoiceCounter() {
      const confirmed = confirm(
        '⚠️ ATTENTION ⚠️\n\n' +
        'Vous êtes sur le point de réinitialiser le compteur de factures.\n\n' +
        'Cette action va:\n' +
        '- Remettre le compteur à 1\n' +
        '- Potentiellement créer des numéros de factures en double\n\n' +
        'Êtes-vous ABSOLUMENT sûr de vouloir continuer?'
      );

      if (!confirmed) return;

      const doubleConfirm = prompt(
        'Pour confirmer, tapez "RESET" en majuscules:'
      );

      if (doubleConfirm !== 'RESET') {
        alert('Réinitialisation annulée.');
        return;

      try {
        await API.resetInvoiceCounter();
        await loadSettings();
        showToast('Compteur de factures réinitialisé', 'warning');
      } catch (error) {
        console.error('Error resetting counter:', error);
        alert('Erreur lors de la réinitialisation: ' + error.message);

    /**
     * Helper: Get user initials for avatar
     */
    function getUserInitials(name) {
      if (!name) return '?';
      const parts = name.split(' ');
      if (parts.length >= 2) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      return name.substring(0, 2).toUpperCase();

  </script>
</body>
</html>
