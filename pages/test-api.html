<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>API Test Page</h1>
  <button onclick="testAPI()">Test getDashboardMetrics</button>
  <pre id="result"></pre>

  <script>
    const API_BASE = window.location.href.split('?')[0];

    async function testAPI() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = 'Loading...';

      try {
        const response = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'getDashboardMetrics' })
        });

        resultEl.textContent = 'Response status: ' + response.status + '\n\n';

        const text = await response.text();
        resultEl.textContent += 'Raw response:\n' + text.substring(0, 1000);

        try {
          const json = JSON.parse(text);
          resultEl.textContent += '\n\nParsed JSON:\n' + JSON.stringify(json, null, 2);
        } catch (e) {
          resultEl.textContent += '\n\nJSON Parse Error: ' + e.message;
        }

      } catch (error) {
        resultEl.textContent = 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
