<header class="app-header">
  <div class="header-content">
    <div class="logo">
      🎨 Style et Matière CRM
    </div>

    <nav class="main-nav" id="main-nav">
      <a href="#" class="nav-link" data-page="dashboard">
        📊 Tableau de Bord
      </a>
      <a href="#" class="nav-link" data-page="clients">
        👥 Clients
      </a>
      <a href="#" class="nav-link" data-page="calendar">
        📅 Calendrier

        ⚙️ Paramètres
      </a>
    </nav>

    <div class="user-menu">
      <span class="user-name">
        <?= user ? user.name : 'Guest' ?>
      </span>
      <? if (user && user.role === 'admin') { ?>
        <span class="user-role">Admin</span>
      <? } ?>
    </div>
  </div>
</header>

<script>
  // Setup navigation with correct absolute URLs
  (function() {
    const baseUrl = window.location.origin + window.location.pathname;
    const currentPage = new URLSearchParams(window.location.search).get('page') || 'dashboard';

    document.querySelectorAll('#main-nav a').forEach(link => {
      const page = link.dataset.page;

      // Set correct absolute URL
      link.href = baseUrl + '?page=' + page;

      // Highlight active page
      if (page === currentPage) {
        link.classList.add('active');
      }

      // Handle click with navigation
      link.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = this.href;
      });
    });
  })();
</script>
