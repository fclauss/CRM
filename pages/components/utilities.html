<script>
/**
 * Shared Utilities Component
 * Consolidated utility functions used across all pages
 * Version: 1.0
 */

/**
 * Format currency value for French locale
 * @param {number} value - Value to format
 * @param {boolean} hideDecimals - Whether to hide decimal places (default: false)
 * @returns {string} Formatted currency string
 */
function formatCurrency(value, hideDecimals = false) {
  if (!value && value !== 0) return '0 €';
  return new Intl.NumberFormat('fr-FR', {
    style: 'currency',
    currency: 'EUR',
    minimumFractionDigits: hideDecimals ? 0 : 2,
    maximumFractionDigits: hideDecimals ? 0 : 2
  }).format(value);
}

/**
 * Escape HTML to prevent XSS
 * @param {string} text - Text to escape
 * @returns {string} Escaped HTML
 */
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/**
 * Format date for French locale
 * @param {string} dateString - Date string to format
 * @returns {string} Formatted date
 */
function formatDate(dateString) {
  if (!dateString) return 'N/A';

  const date = new Date(dateString);
  if (isNaN(date.getTime())) return 'N/A';

  return date.toLocaleDateString('fr-FR', {
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  });
}

/**
 * Show toast notification
 * @param {string} message - Message to display
 * @param {string} type - Toast type: 'success', 'warning', 'error', 'info' (default: 'info')
 */
function showToast(message, type = 'info') {
  const colors = {
    success: '#4CAF50',
    warning: '#FF9800',
    error: '#F44336',
    info: '#2196F3'
  };

  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: ${colors[type] || colors.info};
    color: white;
    padding: 12px 20px;
    border-radius: 5px;
    z-index: 10000;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    animation: slideIn 0.3s ease-out;
  `;
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.animation = 'slideOut 0.3s ease-out';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

/**
 * Show error message in specified container
 * @param {string} message - Error message to display
 * @param {string} containerId - ID of container element (default: 'main-content')
 * @param {string} retryFunction - Name of function to call on retry (optional)
 */
function showError(message, containerId = 'main-content', retryFunction = null) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const retryButton = retryFunction
    ? `<button class="page-btn" onclick="${retryFunction}()" style="margin-top: 20px;">Réessayer</button>`
    : '';

  container.innerHTML = `
    <div style="text-align: center; padding: 40px;">
      <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
      <p style="color: #666;">${escapeHtml(message)}</p>
      ${retryButton}
    </div>
  `;
}

/**
 * Highlight active navigation link based on current page
 */
function highlightActiveNavLink() {
  const currentPage = new URLSearchParams(window.location.search).get('page') || 'dashboard';
  document.querySelectorAll('.app-header a').forEach(link => {
    const href = link.getAttribute('href');
    if (href && href.includes('page=' + currentPage)) {
      link.style.background = 'rgba(255,255,255,0.2)';
      link.style.fontWeight = '500';
    }
  });
}

/**
 * Format percentage value
 * @param {number} value - Value to format (0-100 or 0-1)
 * @param {boolean} isDecimal - Whether value is in decimal form (0-1) instead of percentage (0-100)
 * @returns {string} Formatted percentage string
 */
function formatPercentage(value, isDecimal = false) {
  if (!value && value !== 0) return '0%';
  const percentValue = isDecimal ? value * 100 : value;
  return `${percentValue.toFixed(1)}%`;
}

/**
 * Show loading spinner in specified container
 * @param {string} containerId - ID of container element
 * @param {string} message - Loading message (optional)
 */
function showLoading(containerId, message = 'Chargement...') {
  const container = document.getElementById(containerId);
  if (!container) return;

  container.innerHTML = `
    <div style="text-align: center; padding: 40px;">
      <div style="font-size: 48px; margin-bottom: 20px;">⏳</div>
      <p style="color: #666;">${message}</p>
    </div>
  `;
}

/**
 * Debounce function to limit execution rate
 * @param {Function} func - Function to debounce
 * @param {number} wait - Wait time in milliseconds
 * @returns {Function} Debounced function
 */
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

/**
 * Format large numbers with K/M suffixes
 * @param {number} value - Value to format
 * @returns {string} Formatted number string
 */
function formatCompactNumber(value) {
  if (!value && value !== 0) return '0';
  if (value >= 1000000) {
    return (value / 1000000).toFixed(1) + 'M';
  }
  if (value >= 1000) {
    return (value / 1000).toFixed(1) + 'K';
  }
  return value.toString();
}

</script>
