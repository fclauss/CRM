<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style et Matière - Clients</title>

  <style>
    :root {
      --primary: #00796b;
      --primary-dark: #004d40;
      --secondary: #f2eb2d;
      --gray-light: #f5f7fa;
      --gray-border: #e0e6ed;
      --success: #4CAF50;
      --warning: #ff9800;
      --danger: #f44336;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--gray-light);
      min-height: 100vh;
    }

    .page-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Clients Layout */
    .clients-container {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 20px;
      height: calc(100vh - 120px);
    }

    /* Client List Container */
    .client-list {
      background: white;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Search Box */
    .client-search {
      padding: 12px;
      border-bottom: 1px solid var(--gray-border);
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }

    .client-search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--gray-border);
      border-radius: 4px;
      font-size: 14px;
    }

    .client-search input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 121, 107, 0.1);
    }

    /* Pagination Controls */
    .pagination-controls {
      padding: 12px;
      border-top: 1px solid var(--gray-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      position: sticky;
      bottom: 0;
    }

    .pagination-info {
      font-size: 14px;
      color: #666;
    }

    .pagination-buttons {
      display: flex;
      gap: 8px;
    }

    .page-btn {
      padding: 5px 12px;
      background: white;
      border: 1px solid var(--gray-border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Client List Items */
    .client-list-items {
      flex: 1;
      overflow-y: auto;
    }

    .client-item {
      padding: 15px;
      border-bottom: 1px solid var(--gray-border);
      cursor: pointer;
      transition: background 0.2s;
    }

    .client-item:hover {
      background: var(--gray-light);
    }

    .client-item.selected {
      background: #e8f5e9;
      border-left: 3px solid var(--success);
    }

    .client-name {
      font-weight: 500;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .client-meta {
      font-size: 13px;
      color: #666;
      margin-top: 3px;
    }

    .client-status {
      display: inline-flex;
      align-items: center;
      font-size: 16px;
      line-height: 1;
    }

    .status-new { color: #4CAF50; }
    .status-sent { color: #ff9800; }
    .status-won { color: #2196F3; }
    .status-completed { color: #9E9E9E; }
    .status-cancelled { color: #f44336; }

    /* Client Details Panel */
    .client-details {
      background: white;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      padding: 20px;
      overflow-y: auto;
    }

    .client-details.empty-state {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #999;
      font-size: 16px;
    }

    .detail-header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--gray-border);
    }

    .detail-header h2 {
      font-size: 24px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .detail-section {
      margin-bottom: 25px;
    }

    .detail-section h3 {
      font-size: 14px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .info-row {
      display: flex;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .info-label {
      font-weight: 500;
      min-width: 120px;
      color: #666;
    }

    .info-value {
      color: #333;
    }

    /* Status Dropdown */
    .status-dropdown {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid var(--gray-border);
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .status-dropdown:hover {
      border-color: var(--primary);
    }

    .status-dropdown:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 121, 107, 0.1);
    }

    /* Document List */
    .document-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .document-item {
      padding: 10px;
      background: var(--gray-light);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .document-info {
      flex: 1;
    }

    .document-type {
      font-weight: 500;
      margin-bottom: 3px;
    }

    .document-meta {
      font-size: 12px;
      color: #666;
    }

    .document-actions {
      display: flex;
      gap: 5px;
    }

    .mini-btn {
      padding: 5px 10px;
      font-size: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .mini-btn:hover {
      background: var(--primary-dark);
    }

    .mini-btn.secondary {
      background: #666;
    }

    .mini-btn.secondary:hover {
      background: #444;
    }

    /* Action Buttons */
    .action-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .action-button {
      padding: 10px;
      background: white;
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      font-weight: 500;
    }

    .action-button:hover {
      background: var(--primary);
      color: white;
    }

    .action-button.full-width {
      grid-column: 1 / -1;
    }

    /* Loading Spinner */
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .spinner {
      border: 3px solid var(--gray-border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .clients-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .client-list {
        max-height: 400px;
      }
      .client-details {
        min-height: 300px;
    }
    @media (max-width: 768px) {
      .page-container {
        padding: 10px;
      }
      .action-buttons {
        grid-template-columns: 1fr;
      }
      .info-row {
        flex-direction: column;
        margin-bottom: 12px;
      }
      .info-label {
        min-width: auto;
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="page-container">
    <div class="clients-container">
      <!-- Client List -->
      <div class="client-list">
        <div class="client-search">
          <input
            type="text"
            id="client-search-input"
            placeholder="Rechercher un client..."
            oninput="filterClients()"
          >
          <!-- Status Filter Dropdown -->
          <div style="margin-top: 8px;">
            <label for="status-filter-select" style="font-size: 13px; color: #666; margin-right: 8px;">Filtrer par statut:</label>
            <select id="status-filter-select" onchange="changeStatusFilter()" style="padding: 6px 10px; border: 1px solid var(--gray-border); border-radius: 4px; font-size: 14px; background: white; cursor: pointer;">

              <option value="Nouveau">Nouveau</option>

            <button class="page-btn" id="next-btn" onclick="nextPage()">Suivant →</button>

  <!-- Include API Helper -->
  <?!= include('pages/components/api-helper'); ?>

  <script>
    // Global state
    let allClients = [];
    let filteredClients = [];
    let selectedClientRow = null;
    let currentPage = 1;
    let pendingClientSelection = null; // Store row from URL parameter for auto-selection
    let statusFilter = null; // Store status filter from URL parameter
    const CLIENTS_PER_PAGE = 50;

    /**
     * Initialize clients page on load
     */
    window.addEventListener('DOMContentLoaded', function() {
      checkUrlParameters();    // Must run first to set pendingClientSelection
      loadClientsData();        // Then load data and check for pending selection
      highlightActiveNavLink();
    });

    /**
     * Check URL parameters and sessionStorage for pre-selected client
     * Supports: ?page=clients&row=15 (URL) or sessionStorage
     */
    function checkUrlParameters() {
      // Use server-injected URL parameters (not iframe URL)
      const params = window.URL_PARAMS || {};

      const urlRow = params.row;
      const urlStatus = params.status;

      // Check for status filter from URL (for dashboard quick actions)
      if (urlStatus) {
        statusFilter = urlStatus;
        // Set the dropdown value to match
        const dropdown = document.getElementById('status-filter-select');
        if (dropdown) {
          dropdown.value = urlStatus;
        }
      }

      if (urlRow) {
        const rowNumber = parseInt(urlRow, 10);
        if (!isNaN(rowNumber) && rowNumber > 0) {
          pendingClientSelection = rowNumber;
          return;
        }
      }

      // If no URL parameter, check sessionStorage
      const sessionRow = sessionStorage.getItem('pendingClientSelection');

      if (sessionRow) {
        const rowNumber = parseInt(sessionRow, 10);
        if (!isNaN(rowNumber) && rowNumber > 0) {
          pendingClientSelection = rowNumber;
          // Clear sessionStorage after reading
          sessionStorage.removeItem('pendingClientSelection');
        }
      }
    }

    /**
     * Load all clients data
     */
    async function loadClientsData() {
      try {
        const data = await API.getClientsData();
        allClients = Array.isArray(data) ? data : [];

        // Apply filters (including status filter from URL)
        // filterClients() calls renderCurrentPage() and updatePaginationControls()
        filterClients();

        // Check for pending selection from URL parameter or sessionStorage
        if (pendingClientSelection) {
          const clientIndex = filteredClients.findIndex(c => c.row === pendingClientSelection);

          if (clientIndex !== -1) {
            // Calculate which page this client is on (in filtered list)
            currentPage = Math.floor(clientIndex / CLIENTS_PER_PAGE) + 1;
            renderCurrentPage();
            updatePaginationControls();

            // Auto-select the client
            await selectClient(pendingClientSelection);

            // Clear pending selection
            pendingClientSelection = null;
          }
        }
      } catch (error) {
        showError('Erreur lors du chargement des clients: ' + error.message, 'client-list-items', 'loadClientsData');
      }
    }

    /**
     * Render current page of clients
     */
    function renderCurrentPage() {
      const start = (currentPage - 1) * CLIENTS_PER_PAGE;
      const end = start + CLIENTS_PER_PAGE;
      const pageClients = filteredClients.slice(start, end);
      renderClientList(pageClients);
    }

    /**
     * Render client list
     */
    function renderClientList(clients) {
      const container = document.getElementById('client-list-items');

      if (!clients || clients.length === 0) {
        container.innerHTML = `
          <div style="padding: 40px; text-align: center; color: #999;">
            <p>Aucun client trouvé</p>
            <p style="font-size: 12px; margin-top: 10px;">
              ${allClients.length === 0 ? 'Les clients ajoutés apparaîtront ici' : 'Essayez de modifier votre recherche'}
            </p>
          </div>
        `;
        return;
      }

      let html = '';
      clients.forEach(client => {
        const statusClass = getStatusClass(client.status);
        const statusDot = getStatusDot(client.status);
        const selected = selectedClientRow === client.row ? 'selected' : '';

        html += `
          <div class="client-item ${selected}" onclick="selectClient(${client.row})">
            <div class="client-name">
              <span class="client-status ${statusClass}">${statusDot}</span>
              ${escapeHtml(client.name || 'Sans nom')}
            </div>
            <div class="client-meta">
              📧 ${client.email || 'Pas d\'email'}
            </div>
            <div class="client-meta">
              📄 ${client.lastDocument || 'Aucun document'} • ${formatCurrency(client.amount || 0)}
            </div>
            <div class="client-meta" style="font-size: 11px;">
              ${client.lastAction || 'Aucune action'}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    /**
     * Update pagination controls
     */
    function updatePaginationControls() {
      const controls = document.getElementById('pagination-controls');
      const info = document.getElementById('pagination-info');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      if (filteredClients.length === 0) {
        controls.style.display = 'none';
        return;
      }

      controls.style.display = 'flex';

      const start = (currentPage - 1) * CLIENTS_PER_PAGE + 1;
      const end = Math.min(currentPage * CLIENTS_PER_PAGE, filteredClients.length);
      const total = filteredClients.length;

      info.textContent = `${start}-${end} sur ${total}`;

      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = end >= total;
    }

    /**
     * Go to previous page
     */
    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        renderCurrentPage();
        updatePaginationControls();
      }
    }

    /**
     * Go to next page
     */
    function nextPage() {
      const maxPage = Math.ceil(filteredClients.length / CLIENTS_PER_PAGE);
      if (currentPage < maxPage) {
        currentPage++;
        renderCurrentPage();
        updatePaginationControls();
      }
    }

    /**
     * Filter clients based on search input and status filter
     */
    function filterClients() {
      const searchTerm = document.getElementById('client-search-input').value.toLowerCase();

      filteredClients = allClients.filter(client => {
        // Apply search term filter
        const matchesSearch = !searchTerm || (
          (client.name || '').toLowerCase().includes(searchTerm) ||
          (client.email || '').toLowerCase().includes(searchTerm) ||
          (client.phone || '').toLowerCase().includes(searchTerm)
        );

        // Apply status filter (from URL parameter or dropdown)
        const matchesStatus = !statusFilter || (client.status === statusFilter);

        return matchesSearch && matchesStatus;
      });

      currentPage = 1;
      renderCurrentPage();
      updatePaginationControls();
    }

    /**
     * Handle status filter dropdown change
     */
    function changeStatusFilter() {
      const dropdown = document.getElementById('status-filter-select');
      statusFilter = dropdown.value || null;
      filterClients();
    }

    /**
     * Select a client and show details
     */
    async function selectClient(row) {
      selectedClientRow = row;
      renderCurrentPage(); // Re-render to show selection

      try {
        const client = await API.getClientDetails(row);
        renderClientDetails(client);
      } catch (error) {
        console.error('Error loading client details:', error);
        showDetailsError('Erreur lors du chargement des détails');
      }
    }

    /**
     * Render client details panel
     */
    function renderClientDetails(client) {
      const container = document.getElementById('client-details');
      container.className = 'client-details';

      const statusOptions = [
        'Nouveau',
        'Devis envoyé',
        'Projet gagné',
        'Terminé',
        'Annulé'
      ];

      container.innerHTML = `
        <div class="detail-header">
          <h2>
            <span class="client-status ${getStatusClass(client.status)}">${getStatusDot(client.status)}</span>
            ${escapeHtml(client.name || 'Sans nom')}
          </h2>
        </div>

        <div class="detail-section">
          <h3>Informations de contact</h3>
          <div class="info-row">
            <span class="info-label">Email:</span>
            <span class="info-value">${client.email || 'N/A'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Téléphone:</span>
            <span class="info-value">${client.phone || 'N/A'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Adresse:</span>
            <span class="info-value">${client.address || 'N/A'}</span>
          </div>
        </div>

        <div class="detail-section">
          <h3>Statut du projet</h3>
          <select class="status-dropdown" onchange="updateClientStatus(${client.row}, this.value)">
            ${statusOptions.map(status => `
              <option value="${status}" ${client.status === status ? 'selected' : ''}>
                ${status}
              </option>
            `).join('')}
          </select>
        </div>

        ${renderProjectInfo(client)}
        ${renderDocuments(client)}

        <div class="detail-section">
          <h3>Actions rapides</h3>
          <div class="action-buttons">
            <button class="action-button" onclick="openQuoteBuilder(${client.row})">
              📝 Créer devis
            </button>
            <button class="action-button" onclick="openInvoiceBuilder(${client.row})">
              🧾 Créer facture
            </button>
            <button class="action-button full-width" onclick="sendEmail(${client.row}, 'quote')">
              ✉️ Envoyer email de suivi
            </button>
          </div>
        </div>
      `;
    }

    /**
     * Render project information section
     */
    function renderProjectInfo(client) {
      if (!client.projectStartDate && !client.projectValue) {
        return '';
      }

      return `
        <div class="detail-section">
          <h3>Informations du projet</h3>
          ${client.projectStartDate ? `
            <div class="info-row">
              <span class="info-label">Date de début:</span>
              <span class="info-value">${formatDate(client.projectStartDate)}</span>
            </div>
          ` : ''}
          ${client.projectEndDate ? `
            <div class="info-row">
              <span class="info-label">Date de fin:</span>
              <span class="info-value">${formatDate(client.projectEndDate)}</span>
            </div>
          ` : ''}
          ${client.projectValue ? `
            <div class="info-row">
              <span class="info-label">Valeur:</span>
              <span class="info-value">${formatCurrency(client.projectValue)}</span>
            </div>
          ` : ''}
        </div>
      `;
    }

    /**
     * Render documents section
     */
    function renderDocuments(client) {
      const documents = [];

      if (client.quoteLink) {
        documents.push({
          type: 'Devis',
          number: client.quoteNumber || 'N/A',
          date: client.quoteDate,
          link: client.quoteLink
        });
      }

      if (client.invoiceLink) {
        documents.push({
          type: 'Facture',
          number: client.invoiceNumber || 'N/A',
          date: client.invoiceDate,
          link: client.invoiceLink
        });
      }

      if (documents.length === 0) {
        return `
          <div class="detail-section">
            <h3>Documents</h3>
            <p style="color: #666; font-size: 14px;">Aucun document généré</p>
          </div>
        `;
      }

      return `
        <div class="detail-section">
          <h3>Documents</h3>
          <div class="document-list">
            ${documents.map(doc => `
              <div class="document-item">
                <div class="document-info">
                  <div class="document-type">${doc.type} ${doc.number}</div>
                  <div class="document-meta">${formatDate(doc.date)}</div>
                </div>
                <div class="document-actions">
                  <button class="mini-btn" onclick="window.open('${doc.link}', '_blank')">
                    Ouvrir
                  </button>
                  <button class="mini-btn secondary" onclick="sendEmail(${client.row}, '${doc.type.toLowerCase()}')">
                    Envoyer
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /**
     * Update client status
     */
    async function updateClientStatus(row, newStatus) {
      try {
        await API.updateClientStatus(row, newStatus);

        // Update local data
        const client = allClients.find(c => c.row === row);
        if (client) {
          client.status = newStatus;
        }

        renderCurrentPage(); // Re-render list to show updated status

        // Show success message
        showToast('Statut mis à jour avec succès');
      } catch (error) {
        console.error('Error updating status:', error);
        alert('Erreur lors de la mise à jour du statut: ' + error.message);
        loadClientsData(); // Reload to reset
      }
    }

    /**
     * Open quote builder (will open modal for now)
     */
    function openQuoteBuilder(row) {
      // TODO: Implement quote builder in web app
      alert('Le générateur de devis ouvrira bientôt dans cette interface.\nPour l\'instant, utilisez le menu CRM dans Google Sheets.');
    }
    /**
     * Open invoice builder (will open modal for now)
     */
    function openInvoiceBuilder(row) {
      // TODO: Implement invoice builder in web app
      alert('Le générateur de facture ouvrira bientôt dans cette interface.\nPour l\'instant, utilisez le menu CRM dans Google Sheets.');
    }
    /**
     * Send email to client
     */
    async function sendEmail(row, type) {
      try {
        await API.createEmailDraft(row, type);
        alert('Brouillon d\'email créé avec succès!\nVérifiez votre boîte Gmail.');
      } catch (error) {
        console.error('Error creating email draft:', error);
        alert('Erreur lors de la création du brouillon: ' + error.message);
      }
    }
    /**
     * Helper: Get status class
     */
    function getStatusClass(status) {
      const statusMap = {
        'Nouveau': 'status-new',
        'Devis envoyé': 'status-sent',
        'Projet gagné': 'status-won',
        'Terminé': 'status-completed',
        'Annulé': 'status-cancelled'
      };
      return statusMap[status] || '';
    }
    /**
     * Helper: Get status dot
     */
    function getStatusDot(status) {
      const dotMap = {
        'Nouveau': '🟢',
        'Devis envoyé': '🟡',
        'Projet gagné': '🔵',
        'Terminé': '⚫',
        'Annulé': '🔴'
      };
      return dotMap[status] || '⚪';
    }
    /**
     * Show details error (page-specific override)
     */
    function showDetailsError(message) {
      const container = document.getElementById('client-details');
      container.className = 'client-details empty-state';
      container.innerHTML = `<p style="color: var(--danger);">${escapeHtml(message)}</p>`;
    }
  </script>
</body>
</html>
